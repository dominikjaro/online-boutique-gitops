apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: dev-istio-tls-cert
  namespace: istio-ingress
spec:
  refreshInterval: "1m"
  secretStoreRef:
    name: aws-secret-store
    kind: ClusterSecretStore
  
  target:
    name: gateway-tls
    template:
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ .cert }}"
        tls.key: "{{ .key }}"

  data:
  - remoteRef:
      key: dev/istio-tls-cert
    secretKey: cert
  - remoteRef:
      key: dev/istio-tls-key
    secretKey: key